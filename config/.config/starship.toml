# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# custom.git_lines shells out to git; give it headroom over the 500ms default
# so it doesn't time out on the first prompt after a boot, when neither bash nor
# git is in the page cache yet.
command_timeout = 2500

# Default $all layout, but with the built-in $git_metrics swapped for
# ${custom.git_lines} in the same slot (it counts untracked files, which the
# built-in can't). $custom is dropped so it doesn't render twice.
format = '$username$hostname$localip$shlvl$singularity$kubernetes$nats$directory$vcsh$fossil_branch$fossil_metrics$git_branch$git_commit$git_state${custom.git_lines}$git_status$hg_branch$hg_state$pijul_channel$docker_context$package$bun$c$cmake$cobol$cpp$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$fortran$gleam$golang$gradle$haskell$haxe$helm$java$julia$kotlin$lua$maven$mojo$nim$nodejs$ocaml$odin$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity$swift$terraform$typst$vlang$vagrant$xmake$zig$buf$guix_shell$nix_shell$conda$pixi$meson$spack$memory_usage$aws$gcloud$openstack$azure$direnv$env_var$mise$crystal$sudo$cmd_duration$line_break$jobs$battery$time$status$container$netns$os$shell$character'

# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = '[➜](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[aws]
disabled = true

[git_branch]
style = 'yellow'

# Replaced by the custom module below, which counts untracked files as additions.
[git_metrics]
disabled = true

# Not named 'git_metrics': a custom module inherits the same-named built-in's
# `disabled` flag, so it would silently never render.
#
# The script colors its own output (green additions, red deletions) because a
# custom module exposes a single $output variable and so can't style the two
# counts differently. Starship rewrites those escapes into %{...%} for zsh, so
# prompt width stays correct.
#
# require_repo gates the module, but starship won't run a custom module at all
# unless a `when`/detect_* trigger is present -- hence the no-op `when`.
[custom.git_lines]
description = "Added/deleted lines, counting untracked files as additions"
command = 'starship-git-metrics'
require_repo = true
when = 'true'
format = '($output )'
shell = ['bash', '--noprofile', '--norc']
